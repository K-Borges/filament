services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
    restart: unless-stopped

volumes:
  sqlite_data:
  storage_data:
